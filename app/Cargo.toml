[package]
name = "gty"
version = "0.1.0"
edition = "2021"
description = "code-gty's terminal as a desktop app: the extension's terminal page in the system web view, sharing sessions with VS Code"
license = "MIT"
publish = false
rust-version = "1.86"

[[bin]]
name = "gty"
path = "src/main.rs"

[dependencies]
# The sidecar, linked in: `gty --server` is the session daemon, the same one
# the VS Code extension uses. Its `native` feature has the daemon client, the
# page's bridge and browser mode (shared with app/browser/).
gty-sidecar = { path = "../sidecar", features = ["native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "=0.37.2"
wry = "=0.57.2"

# The clipboard (src/clipboard.rs): GTK's where the window is GTK's (the gtk
# crate tao and wry already use), arboard on Windows and macOS.
[target.'cfg(not(any(target_os = "windows", target_os = "macos")))'.dependencies]
gtk = "=0.18.2"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
arboard = { version = "=3.7.0", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# The Linux builds: the page is not built in; the launcher carries it, once
# for the app and browser mode (src/assets.rs, pack.sh).
page-payload = []

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
