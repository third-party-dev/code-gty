[package]
name = "gty-sidecar"
version = "0.1.0"
edition = "2021"
description = "PTY broker for the code-gty VS Code extension"
license = "MIT"
publish = false
rust-version = "1.86"

[lib]
name = "gty_sidecar"
path = "src/lib.rs"

[[bin]]
name = "gty-sidecar"
path = "src/main.rs"

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff", "tga", "pnm", "qoi"] }
portable-pty = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmi = { version = "2.0.3", default-features = false, features = ["std", "simd", "validate", "auto-dispatch"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# Unwind, so a panic in an image decoder is caught on its thread (decode.rs)
# instead of ending every terminal session.
panic = "unwind"
