# Release: for a tag vX.Y.Z (the version in extension/package.json) on a
# commit of the `publish` branch, builds and tests everything (build.yml),
# makes a draft GitHub release with every file, and publishes the extension.
#
#   git push origin main:publish        # or merge into publish
#   git tag v0.1.0 origin/publish && git push origin v0.1.0
#
# Publishing the extension:
#   VS Code Marketplace   secret VSCE_PAT   (VS Code)
#   Open VSX              secret OVSX_PAT   (VSCodium, code-server, Coder, Gitpod, ...)
# Each is skipped when its secret is not set. The publish job runs in the
# "marketplace" environment: add required reviewers to it (Settings >
# Environments) to approve each publish by hand. The GitHub release stays a
# draft until someone publishes it.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Tags are not tied to a branch: only release commits that are on `publish`.
  on-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: The tagged commit is on the publish branch
        run: |
          git fetch --no-tags origin publish
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || {
            echo "$GITHUB_REF_NAME ($GITHUB_SHA) is not on the publish branch"; exit 1; }

  build:
    needs: on-publish
    uses: ./.github/workflows/build.yml
    secrets: inherit

  github-release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag is the extension's version
        run: |
          version=$(node -p 'require("./extension/package.json").version')
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME, but extension/package.json says $version"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Collect and check
        run: |
          rm -rf artifacts/app-page   # build input, not a release file
          mkdir release
          for d in artifacts/*; do (cd "$d" && sha256sum -c SHA256SUMS); done
          find artifacts -type f ! -name SHA256SUMS -exec cp {} release/ \;
          (cd release && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes

  publish:
    needs: github-release
    runs-on: ubuntu-24.04
    environment: marketplace
    env:
      # Only whether each token is set (a step's `if` cannot read secrets).
      HAS_VSCE_PAT: ${{ secrets.VSCE_PAT != '' }}
      HAS_OVSX_PAT: ${{ secrets.OVSX_PAT != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.0"   # as NODE_IMAGE in the Dockerfile
      - name: vsce (the version in extension/package-lock.json)
        working-directory: extension
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: vsix
      - name: Check
        run: (cd vsix && sha256sum -c SHA256SUMS)
      - name: VS Code Marketplace
        if: ${{ env.HAS_VSCE_PAT == 'true' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          for f in vsix/*.vsix; do
            (cd extension && npx vsce publish --packagePath "../$f")
          done
      - name: Open VSX
        if: ${{ env.HAS_OVSX_PAT == 'true' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          for f in vsix/*.vsix; do
            npx --yes ovsx@1.3.0 publish "$f"   # as OVSX_VERSION in the Dockerfile
          done
